# improve colors
set -g base-index 1
set-window-option -g pane-base-index 1
set-option -g history-limit 100000
set -s escape-time 0
set-option -g focus-events on


# act like vim
setw -g mode-keys vi
bind \; last-window

# Map Ctrl-c to copy visible contents to tmux buffer and system clipboard
bind C-c capture-pane -J \; save-buffer /tmp/tmux-buffer-copy \; run-shell "xclip -selection clipboard -i < /tmp/tmux-buffer-copy"

set-option -g mouse on
set-option -g focus-events on
set-option -s set-clipboard off
bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "xclip -selection clipboard -i"
# bind-key @ join-pane -h -s !
bind-key '#' select-layout main-vertical \; resize-pane -t 1 -x '66%'
bind-key '@' select-layout main-vertical \; resize-pane -t 1 -x '50%'


# Setup 'v' to begin selection as in Vim
bind-key -Tcopy-mode-vi 'v' send -X begin-selection
bind-key -Tcopy-mode-vi 'y' send -X copy-pipe "xclip -selection clipboard -i"

# Update default binding of `Enter` to also use copy-pipe
# unbind -T copy-mode-vi Enter

bind-key '_' split-window -v -c "#{pane_current_path}"
bind-key '-' split-window -v -c "#{pane_current_path}"
bind-key '\' split-window -h -c "#{pane_current_path}"
bind-key '|' split-window -h -c "#{pane_current_path}"

# loud or quiet?
set-option -g visual-activity off
set-option -g visual-bell off
set-option -g visual-silence off
set-window-option -g monitor-activity off
set-option -g bell-action none

# ==================
# {n}vim compability
set-option -a terminal-overrides ",alacritty:RGB"
# Proper colors
set-option -sa terminal-features ',alacritty:RGB' # Makes sure that colors in tmux are the same as without tmux

# Undercurl
set -g default-terminal "tmux-256color"
set-option -ga terminal-features ",alacritty:usstyle"

# Shared Gruvbox colors and pane feedback (installed via ~/.config).
source-file ~/.config/tmux/gruvbox.conf
