# Gruvbox dark, matching Neovim and Alacritty.
# Keep application foreground/background inherited from the terminal.
set -g window-style 'fg=default,bg=default'
set -g window-active-style 'fg=default,bg=default'

# Status bar: dark background, subdued inactive windows, yellow active window.
set -g status-style 'fg=#a89984,bg=#282828'
set -g status-justify left
set -g status-position bottom
set -g status-interval 2
set -g status-left ''
set -g status-right '#[fg=#83a598]#H'
set -g status-right-length 50
set -g status-left-length 20
set -g window-status-style 'fg=#a89984,bg=default'
set -g window-status-current-style 'fg=#282828,bg=#fabd2f,bold'
setw -g window-status-format ' #I:#W#F '
setw -g window-status-current-format ' #I:#W#F '
setw -g window-status-activity-style 'fg=#83a598,bg=#3c3836'
setw -g window-status-bell-style 'fg=#282828,bg=#fb4934,bold'
setw -g window-status-last-style 'fg=#d5c4a1,bg=default'

# Borders distinguish the active pane without changing its background.
set -g pane-border-style 'fg=#665c54'
set -g pane-active-border-style 'fg=#fabd2f'
set -g pane-border-status off

# Copy mode, prompts, pane numbers, and clock.
setw -g mode-style 'fg=#282828,bg=#83a598,bold'
set -g message-style 'fg=#ebdbb2,bg=#3c3836'
set -g message-command-style 'fg=#fabd2f,bg=#3c3836'
set -g display-panes-colour '#928374'
set -g display-panes-active-colour '#fabd2f'
setw -g clock-mode-colour '#b8bb26'

# Flash Gruvbox dark gray at a pane edge, then restore the terminal background.
bind h if -F '#{pane_at_left}'   'run-shell "tmux select-pane -P bg=#504945 ; sleep 0.2 ; tmux select-pane -P bg=default"' 'select-pane -L'
bind j if -F '#{pane_at_bottom}' 'run-shell "tmux select-pane -P bg=#504945 ; sleep 0.2 ; tmux select-pane -P bg=default"' 'select-pane -D'
bind k if -F '#{pane_at_top}'    'run-shell "tmux select-pane -P bg=#504945 ; sleep 0.2 ; tmux select-pane -P bg=default"' 'select-pane -U'
bind l if -F '#{pane_at_right}'  'run-shell "tmux select-pane -P bg=#504945 ; sleep 0.2 ; tmux select-pane -P bg=default"' 'select-pane -R'
bind C-l if -F '#{pane_at_right}' 'run-shell "tmux select-pane -P bg=#504945 ; sleep 0.2 ; tmux select-pane -P bg=default"' 'select-pane -R'
bind C-k if -F '#{pane_at_top}'   'run-shell "tmux select-pane -P bg=#504945 ; sleep 0.2 ; tmux select-pane -P bg=default"' 'select-pane -U'

# Use the same flash when selecting a pane or window.
set-hook -g after-select-pane "run-shell 'tmux select-pane -P bg=#504945 ; sleep 0.2 ; tmux select-pane -P bg=default'"
set-hook -g after-select-window "run-shell 'tmux select-pane -P bg=#504945 ; sleep 0.2 ; tmux select-pane -P bg=default'"
