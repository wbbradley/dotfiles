[window]
decorations = "Full"
option_as_alt = "OnlyRight"

[scrolling]
history = 100000

[selection]
save_to_clipboard = true

[font]
normal = { family = "FiraCode Nerd Font Mono", style = "Regular" }
bold = { family = "FiraCode Nerd Font Mono", style = "Medium" }
italic = { family = "RecMonoCasual Nerd Font Mono", style = "Italic" }
bold_italic = { family = "RecMonoCasual Nerd Font Mono", style = "Bold Italic" }
size = 10
builtin_box_drawing = true

[terminal]
osc52 = "OnlyCopy"

[mouse]
hide_when_typing = false

[[keyboard.bindings]]
key = "C"
mods = "Alt"
action = "Copy"

[[keyboard.bindings]]
key = "V"
mods = "Alt"
action = "Paste"

[[keyboard.bindings]]
key = "Return"
mods = "Shift"
chars = "\u001B\r"

[[keyboard.bindings]]
key = "Up"
mods = "Alt"
chars = "\u001b[1;3A"

[[keyboard.bindings]]
key = "N"
mods = "Control|Shift"
action = "CreateNewWindow"

# Match Neovim gruvbox Normal colors.
[colors.primary]
background = "#282828"
foreground = "#ebdbb2"
